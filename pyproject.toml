[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-schema"
version = "0.1.0"
description = "Canonical PostgreSQL/PostGIS pilot schema for Project IRIS (IRIS-CAND-03)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
iris-db = "iris_schema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: requires a running PostgreSQL/PostGIS instance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests embed SQL verbatim; wrapping it hurts readability more than long lines do.
"tests/*" = ["E501"]
